# Source legitimacy config for Throughline.
#
# These lists decide which domains are trusted, which are blocked outright, and
# which broad seeds drive weekly discovery. They live here, in config, so the
# trust model can be tuned without touching code (was previously hard-coded in
# src/throughline/tools.py). Edit freely — one domain per line, no leading "www.".

# max_verify_retries: how many times the editor may send a researcher back to
# close unsupported-citation gaps before giving up and dropping the claims. A
# hard cap on the verify -> re-research -> re-verify loop.
max_verify_retries = 2

# deny: press-release / wire domains. Almost always reworded marketing, so they
# are dropped before any researcher sees them. Subdomains are covered too.
deny = [
  "prnewswire.com",
  "businesswire.com",
  "globenewswire.com",
  "prweb.com",
  "newswire.com",
  "einpresswire.com",
  "einnews.com",
  "accesswire.com",
  "prlog.org",
]

# allow: reputable, independent sources. Tagged "[reputable]" so the model gets a
# deterministic quality signal instead of guessing. Subdomains are covered too.
allow = [
  "arxiv.org",
  "reuters.com",
  "apnews.com",
  "bloomberg.com",
  "ft.com",
  "wsj.com",
  "nytimes.com",
  "washingtonpost.com",
  "theguardian.com",
  "economist.com",
  "theverge.com",
  "techcrunch.com",
  "wired.com",
  "arstechnica.com",
  "theinformation.com",
  "semianalysis.com",
  "nature.com",
  "science.org",
]

# scan_seeds: broad, deliberately generic queries used only for discovery and
# clustering. Kept generic so topics emerge from the week's writing, not a fixed
# editorial list.
scan_seeds = [
  "artificial intelligence",
  "large language models",
  "AI model release",
  "AI research paper",
  "AI agents",
  "AI policy regulation",
  "AI infrastructure compute",
]

# review: when to pause the finished report for a human before publishing.
# The report is auto-approved on a clean week; a human is only asked to review
# when one of these risk signals shows up in the drafted report. Tune freely.
[review]
# Sensitive domains where an editorial human should always take a look, however
# well-sourced the story is (dual-use, security, safety, integrity risks).
sensitive_terms = [
  "bioweapon",
  "biosecurity",
  "bioterror",
  "pathogen",
  "viral genome",
  "nerve agent",
  "chemical weapon",
  "cbrn",
  "malware",
  "ransomware",
  "zero-day",
  "self-harm",
  "election manipulation",
  "disinformation campaign",
]
# Phrases the editor uses when it is itself unsure — a proxy for low confidence
# or verification that could not fully close. Their presence forces a review.
uncertainty_markers = [
  "remains thin",
  "could not verify",
  "could not confirm",
  "unconfirmed",
  "unverified",
  "no independent",
  "corroboration remains",
  "not been independently",
]
# Below this many distinct cited sources across the whole report, the sourcing is
# considered too thin to publish unreviewed.
min_sources = 8
